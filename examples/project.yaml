apiVersion: opsmanager.crossplane.io/v1alpha1
kind: OpsManagerProject
metadata:
  name: test-project
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    name: "test-project"
    # Replace with your actual org ID from:
    # Ops Manager UI → top-left org menu → Settings → Organization ID
    orgId: "6a09b573a4d0a92fff4a29fb"
    ldapGroupMappings:
      - roleName: GROUP_OWNER
        ldapGroups:
          - "ou=opsmanager-admins,ou=users,dc=opsmanager,dc=local"
      - roleName: GROUP_DATA_ACCESS_ADMIN
        ldapGroups:
          - "ou=opsmanager-developers,ou=users,dc=opsmanager,dc=local"
      - roleName: GROUP_READ_ONLY
        ldapGroups:
          - "ou=opsmanager-readonly,ou=users,dc=opsmanager,dc=local"
    # Optional: nested snapshot schedule / retention policy.
    # All fields are optional; nil = don't manage (OM keeps current value).
    # Requires at least one cluster in the project to have backup enabled.
    # snapshotSchedule:
    #   snapshotRetentionDays:          2
    #   dailySnapshotRetentionDays:     7
    #   weeklySnapshotRetentionWeeks:   4
    #   monthlySnapshotRetentionMonths: 12
    #   pointInTimeWindowHours:         24
    #   snapshotIntervalHours:          6
